<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LM Studio Chat + MCP</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 750px; margin: 2rem auto; padding: 0 1rem; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
    select, input, button { font-size: 0.95rem; padding: 0.45rem 0.6rem; }
    #server-url { width: 200px; }
    select { flex: 1; min-width: 200px; }
    button { cursor: pointer; background: #333; color: #fff; border: none; border-radius: 4px; }
    button:hover { background: #555; }
    button:disabled { background: #999; cursor: not-allowed; }
    #mcp-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; margin-bottom: 0.5rem; }
    #mcp-panel { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.75rem; display: none; }
    #mcp-panel.open { display: block; }
    #mcp-panel label { font-size: 0.85rem; display: block; margin-bottom: 0.25rem; }
    .integration-row { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 0.4rem; flex-wrap: wrap; }
    .integration-row select { flex: 1; min-width: 180px; }
    .integration-row input { flex: 1; min-width: 120px; padding: 0.35rem 0.5rem; font-size: 0.85rem; }
    .integration-row button { padding: 0.35rem 0.6rem; font-size: 0.8rem; background: #c0392b; border-radius: 4px; }
    .integration-row button:hover { background: #e74c3c; }
    .integration-config { margin-left: 1rem; margin-bottom: 0.5rem; font-size: 0.85rem; display: none; }
    .integration-config.open { display: block; }
    .integration-config input, .integration-config textarea {
      width: 100%; padding: 0.35rem 0.5rem; font-size: 0.85rem; margin-bottom: 0.25rem;
      border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
    }
    .integration-config textarea { min-height: 60px; resize: vertical; font-family: monospace; }
    .integrations-list { margin-top: 0.5rem; }
    .integrations-list .item { background: #f6f8fa; border: 1px solid #ddd; border-radius: 4px; padding: 0.4rem 0.6rem; margin-bottom: 0.3rem; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
    .integrations-list .item .remove-btn { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 1.1rem; padding: 0 0.3rem; }
    #log { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-height: 200px; margin-bottom: 0.75rem; white-space: pre-wrap; }
    .msg { margin-bottom: 0.6rem; }
    .msg.user { color: #0057b7; font-weight: 500; }
    .msg.assistant { color: #1a1a1a; }
    .msg.reasoning { color: #555; font-size: 0.85rem; background: #f6f8fa; border-left: 3px solid #888; padding: 0.4rem 0.6rem; border-radius: 3px; }
    .msg.tool { color: #7a5c00; font-size: 0.85rem; background: #fffbe6; padding: 0.4rem; border-radius: 4px; }
    .msg.stats { color: #888; font-size: 0.8rem; margin-top: 0.5rem; }
    .input-row { display: flex; gap: 0.4rem; align-items: center; }
    .input-row input { flex: 1; }
    #mic-btn {
      width: 38px; height: 38px; min-width: 38px;
      border-radius: 50%; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, box-shadow 0.2s;
    }
    #mic-btn.recording {
      background: #c0392b !important;
      animation: pulse 1.2s infinite;
    }
    .speak-btn {
      background: none; border: 1px solid #ccc; border-radius: 50%;
      width: 28px; height: 28px; min-width: 28px; font-size: 0.9rem;
      cursor: pointer; display: inline-flex; align-items: center;
      justify-content: center; margin-left: 0.4rem; transition:
      background 0.2s, border-color 0.2s; vertical-align: middle;
    }
    .speak-btn:hover { background: #e8f4fd; border-color: #0057b7; }
    .speak-btn.speaking { background: #d4edda; border-color: #28a745; }
    #voice-select {
      margin-left: 0.5rem;
      padding: 0.2rem 0.4rem;
      font-size: 0.85rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
    }
    #voice-select:focus { outline: none; border-color: #0057b7; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(192,57,43,0); }
    }
    #status { font-size: 0.85rem; color: #888; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <h1>LM Studio Chat <small style="font-size:0.6em;color:#888">+ MCP</small></h1>

  <div class="controls">
    <input id="server-url" value="http://localhost:1235" placeholder="http://localhost:1235" title="LM Studio API Base URL" />
    <select id="model"><option>Loading models…</option></select>
    <button id="refresh" title="Reload Models">↻</button>
  </div>

  <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-top:0.3rem">
    <label id="tts-toggle">
      <input type="checkbox" id="tts-enabled" checked /> 🔊 Auto-speak responses
    </label>
    <select id="voice-select" title="Select voice">
      <option value="">Loading voices…</option>
    </select>
  </div>
  <label id="mcp-toggle">
    <input type="checkbox" id="mcp-enabled" /> Enable MCP integrations
  </label>
  <div id="mcp-panel">
    <label>Integrations:</label>

    <!-- Add integration row -->
    <div class="integration-row">
      <select id="integration-type">
        <option value="">— Select type —</option>
        <option value="plugin">Plugin (e.g. playwright)</option>
        <option value="mcp_server" selected>Custom MCP Server</option>
      </select>
      <!-- Plugin config -->
      <div id="config-plugin" class="integration-config">
        <input type="text" id="plugin-id" placeholder="Plugin ID (e.g. mcp/playwright)" />
        <textarea id="plugin-tools" placeholder='Allowed tools, comma-separated (e.g. browser_navigate,browser_click)'></textarea>
      </div>
      <!-- MCP Server config -->
      <div id="config-mcp_server" class="integration-config open">
        <input type="text" id="mcp-server-name" placeholder="Server name (e.g. WebSearch)" value="WebSearch" />
        <input type="text" id="mcp-server-url" placeholder="MCP Server URL (e.g. http://localhost:3001)" />
      </div>
      <button id="add-integration">+ Add</button>
    </div>

    <!-- List of added integrations -->
    <div class="integrations-list" id="integrations-list"></div>
  </div>

  <div id="log"></div>
  <div class="input-row">
    <input id="input" placeholder="Type a message…" autocomplete="off" />
    <button id="mic-btn" title="Voice input (click to start)" type="button">🎤</button>
    <button id="send">Send</button>
  </div>
  <div id="status"></div>

  <script>
    const serverUrlInput = document.getElementById("server-url");
    const modelSel = document.getElementById("model");
    const refreshBtn = document.getElementById("refresh");
    const mcpEnabled = document.getElementById("mcp-enabled");
    const mcpPanel = document.getElementById("mcp-panel");
    const integrationTypeSel = document.getElementById("integration-type");
    const configPlugin = document.getElementById("config-plugin");
    const configMcpServer = document.getElementById("config-mcp_server");
    const addIntegrationBtn = document.getElementById("add-integration");
    const integrationsListEl = document.getElementById("integrations-list");

    // Stored integrations array (built from the UI)
    let integrations = [];

    // Show/hide config panels based on selected type
    integrationTypeSel.addEventListener("change", () => {
      const val = integrationTypeSel.value;
      configPlugin.classList.toggle("open", val === "plugin");
      configMcpServer.classList.toggle("open", val === "mcp_server");
    });
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const micBtn = document.getElementById("mic-btn");
    const status = document.getElementById("status");

    // Load saved server URL preference if available
    const savedUrl = localStorage.getItem("lmstudio_server_url");
    if (savedUrl) {
      serverUrlInput.value = savedUrl;
    }

    function getServerBase() {
      return (serverUrlInput.value.trim() || "http://localhost:1235").replace(/\/+$/, "");
    }

    serverUrlInput.addEventListener("change", () => {
      localStorage.setItem("lmstudio_server_url", getServerBase());
      loadModels();
    });

    async function fetchModelsFromUrl(base) {
      const res = await fetch(`${base}/api/v1/models`);
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      return await res.json();
    }

    // --- Model list ---
    async function loadModels() {
      modelSel.innerHTML = '<option>Loading…</option>';
      status.textContent = 'Connecting to LM Studio…';

      let base = getServerBase();
      let data = null;

      try {
        data = await fetchModelsFromUrl(base);
      } catch (err) {
        // Smart fallback: try switching between 1235 and 1234
        const fallback = base.includes(":1234")
          ? base.replace(":1234", ":1235")
          : base.includes(":1235")
            ? base.replace(":1235", ":1234")
            : null;

        if (fallback) {
          try {
            data = await fetchModelsFromUrl(fallback);
            base = fallback;
            serverUrlInput.value = base;
            localStorage.setItem("lmstudio_server_url", base);
          } catch (_) {
            // Keep original error if fallback also failed
          }
        }

        if (!data) {
          modelSel.innerHTML = '<option>Failed to load models</option>';
          status.textContent = `Model list error from ${base}: ${err.message}. Ensure LM Studio local server is started.`;
          return;
        }
      }

      try {
        const llms = (data.models || []).filter(m => m.type === "llm");
        modelSel.innerHTML = "";
        if (!llms.length) {
          modelSel.innerHTML = '<option>No LLM models found</option>';
          status.textContent = `Connected to ${base}, but no LLM models were returned.`;
          return;
        }

        let selectedKey = null;
        for (const m of llms) {
          const opt = document.createElement("option");
          opt.value = m.key;
          const isLoaded = Array.isArray(m.loaded_instances) && m.loaded_instances.length > 0;
          opt.textContent = `${m.display_name || m.key}${isLoaded ? " (Loaded)" : ""}`;
          if (isLoaded && !selectedKey) {
            selectedKey = m.key;
          }
          modelSel.appendChild(opt);
        }

        if (selectedKey) {
          modelSel.value = selectedKey;
        }

        status.textContent = `Connected to ${base} (${llms.length} model${llms.length === 1 ? "" : "s"} found)`;
      } catch (e) {
        modelSel.innerHTML = '<option>Failed to load models</option>';
        status.textContent = `Model list parse error: ${e.message}`;
      }
    }

    refreshBtn.addEventListener("click", loadModels);
    loadModels();

    // --- MCP toggle ---
    mcpEnabled.addEventListener("change", () => {
      mcpPanel.classList.toggle("open", mcpEnabled.checked);
    });

    // --- Chat ---
    function addMsg(cls, text) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.textContent = text;
      
      // Add speak button for assistant messages
      if (cls === "assistant") {
        const btn = document.createElement("button");
        btn.className = "speak-btn";
        btn.innerHTML = "🔊";
        btn.title = "Read aloud";
        btn.addEventListener("click", () => speakText(text, btn));
        div.appendChild(btn);
      }
      
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;

      const model = modelSel.value;
      if (!model || model.startsWith("Failed") || model.startsWith("Loading") || model.startsWith("No LLM")) {
        status.textContent = "Please select a valid model first.";
        return;
      }

      const base = getServerBase();
      input.value = "";
      addMsg("user", `You: ${text}`);
      status.textContent = "Waiting for response…";
      sendBtn.disabled = true;

      const body = {
        model: model,
        input: text,
        context_length: 8000
      };

      if (mcpEnabled.checked) {
        body.integrations = integrations;
      }

      try {
        const res = await fetch(`${base}/api/v1/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.error) {
          throw new Error(data.error.message || JSON.stringify(data.error));
        }

        // Render output items (messages, tool calls, reasoning)
        if (Array.isArray(data.output)) {
          for (const item of data.output) {
            if (item.type === "tool_call") {
              const args = JSON.stringify(item.arguments, null, 2);
              addMsg("tool", `🔧 Tool: ${item.tool}\n   Args: ${args}\n   Result: ${String(item.output).slice(0, 300)}`);
            } else if (item.type === "reasoning") {
              addMsg("reasoning", `💭 Reasoning:\n${item.content}`);
            } else if (item.type === "message") {
              const msgText = `Assistant: ${item.content}`;
              addMsg("assistant", msgText);
              // Auto-speak if toggle is enabled
              if (document.getElementById("tts-enabled").checked) {
                setTimeout(() => speakText(msgText, null), 100);
              }
            }
          }
        }

        // Stats
        if (data.stats) {
          const s = data.stats;
          addMsg("stats",
            `⏱ ${s.time_to_first_token_seconds?.toFixed(2)}s TTFT · ` +
            `${s.tokens_per_second?.toFixed(1)} tok/s · ` +
            `${s.input_tokens} in / ${s.total_output_tokens} out`
          );
        }

        status.textContent = "";
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
      }
    }

    // --- Text-to-Speech (TTS) ---
    let ttsVoiceIndex = -1;
    let currentUtterance = null;
    const femaleKeywords = ["zira", "aria", "samantha", "karen", "moira", "allison", "helena", "jenny", "anna", "victoria", "female", "tessa", "fiona", "amy"];

    function loadTTSVoices() {
      const voices = speechSynthesis.getVoices();
      if (!voices.length) return;
      
      // Build voice selector dropdown
      const select = document.getElementById("voice-select");
      select.innerHTML = "";
      
      // Separate female and other voices, prioritize neural ones
      let femaleNeuralVoices = [];
      let femaleStandardVoices = [];
      let otherEnglishVoices = [];
      
      for (let i = 0; i < voices.length; i++) {
        const name = voices[i].name.toLowerCase();
        const isFemale = femaleKeywords.some(kw => name.includes(kw));
        const isNeural = name.includes("neural") || name.includes("online") || name.includes("dnn");
        
        if (voices[i].lang.startsWith("en")) {
          if (isFemale && isNeural) femaleNeuralVoices.push(i);
          else if (isFemale) femaleStandardVoices.push(i);
          else otherEnglishVoices.push(i);
        }
      }
      
      // Add section header for female voices
      const femaleGroup = document.createElement("optgroup");
      femaleGroup.label = "👩 Female Voices";
      
      // Add neural female voices first (best quality)
      if (femaleNeuralVoices.length) {
        const neuralHeader = document.createElement("option");
        neuralHeader.value = "-1";
        neuralHeader.textContent = "── Neural (Best Quality) ──";
        neuralHeader.disabled = true;
        femaleGroup.appendChild(neuralHeader);
        
        for (const idx of femaleNeuralVoices) {
          const opt = document.createElement("option");
          opt.value = idx;
          opt.textContent = voices[idx].name + " ⭐";
          femaleGroup.appendChild(opt);
        }
      }
      
      // Add standard female voices
      if (femaleStandardVoices.length) {
        const stdHeader = document.createElement("option");
        stdHeader.value = "-1";
        stdHeader.textContent = "── Standard ──";
        stdHeader.disabled = true;
        femaleGroup.appendChild(stdHeader);
        
        for (const idx of femaleStandardVoices) {
          const opt = document.createElement("option");
          opt.value = idx;
          opt.textContent = voices[idx].name;
          femaleGroup.appendChild(opt);
        }
      }
      
      // If no female voices found, show a message
      if (!femaleNeuralVoices.length && !femaleStandardVoices.length) {
        const msg = document.createElement("option");
        msg.value = "-1";
        msg.textContent = "⚠️ No female voices detected (check Windows 11 voice settings)";
        msg.disabled = true;
        femaleGroup.appendChild(msg);
      }
      
      select.appendChild(femaleGroup);
      
      // Add other English voices section
      if (otherEnglishVoices.length) {
        const otherGroup = document.createElement("optgroup");
        otherGroup.label = "🔊 Other Voices";
        for (const idx of otherEnglishVoices) {
          const opt = document.createElement("option");
          opt.value = idx;
          opt.textContent = voices[idx].name + (voices[idx].localService ? " (Local)" : " (Online)");
          otherGroup.appendChild(opt);
        }
        select.appendChild(otherGroup);
      }
      
      // Restore saved selection or auto-select best female voice
      const savedIndex = localStorage.getItem("tts-voice-index");
      let selectedIndex = -1;
      
      if (savedIndex !== null && parseInt(savedIndex) >= 0 && parseInt(savedIndex) < voices.length) {
        selectedIndex = parseInt(savedIndex);
      } else if (femaleNeuralVoices.length > 0) {
        selectedIndex = femaleNeuralVoices[0];
      } else if (femaleStandardVoices.length > 0) {
        selectedIndex = femaleStandardVoices[0];
      }
      
      if (selectedIndex >= 0) {
        select.value = selectedIndex;
        ttsVoiceIndex = selectedIndex;
        const voiceName = voices[selectedIndex].name;
        const isNeural = voiceName.toLowerCase().includes("neural") || voiceName.toLowerCase().includes("online");
        console.log(`TTS: Selected voice #${selectedIndex}: ${voiceName} (${isNeural ? 'Neural ⭐' : 'Standard'})`);
      }
      
      // Save selection when changed
      select.addEventListener("change", () => {
        ttsVoiceIndex = parseInt(select.value);
        localStorage.setItem("tts-voice-index", select.value);
        const voices = speechSynthesis.getVoices();
        if (voices[ttsVoiceIndex]) {
          console.log(`TTS: Changed to voice #${ttsVoiceIndex}: ${voices[ttsVoiceIndex].name}`);
        }
      });
    }

    // Load voices (may need to wait for them to be available)
    speechSynthesis.onvoiceschanged = loadTTSVoices;
    window.addEventListener("load", loadTTSVoices);

    function speakText(text, btn) {
      // Stop any current speech
      speechSynthesis.cancel();
      
      if (btn) {
        btn.classList.add("speaking");
        btn.innerHTML = "⏹";
      }
      
      const utterance = new SpeechSynthesisUtterance(text);
      currentUtterance = utterance;
      
      // Set voice if available
      if (ttsVoiceIndex >= 0) {
        const voices = speechSynthesis.getVoices();
        if (voices[ttsVoiceIndex]) {
          utterance.voice = voices[ttsVoiceIndex];
        }
      }
      
      // Optimize for natural-sounding speech
      utterance.lang = "en-US";
      utterance.rate = 0.95; // Slightly slower for clarity and naturalness
      utterance.pitch = 1.05; // Subtle pitch adjustment (less robotic)
      utterance.volume = 1.0;
      
      utterance.onend = () => {
        if (btn) {
          btn.classList.remove("speaking");
          btn.innerHTML = "🔊";
        }
        currentUtterance = null;
      };
      
      utterance.onerror = () => {
        if (btn) {
          btn.classList.remove("speaking");
          btn.innerHTML = "🔊";
        }
        currentUtterance = null;
      };
      
      speechSynthesis.speak(utterance);
    }

    // --- Voice transcription ---
    let recognition = null;
    let isRecording = false;

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        status.textContent = "⚠️ Speech Recognition not supported in this browser. Try Chrome or Edge.";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      let finalTranscript = "";

      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + " ";
          } else {
            interim += transcript;
          }
        }
        input.value = finalTranscript.trim() + interim;
      };

      recognition.onerror = (event) => {
        status.textContent = `⚠️ Speech error: ${event.error}`;
        stopListening();
      };

      recognition.onend = () => {
        // Auto-stop if silence detected; keep UI consistent
        if (isRecording) stopListening();
      };

      recognition.start();
      isRecording = true;
      micBtn.classList.add("recording");
      status.textContent = "🎤 Listening… click the mic to stop.";
    }

    function stopListening() {
      if (recognition) {
        recognition.stop();
        recognition = null;
      }
      isRecording = false;
      micBtn.classList.remove("recording");
      status.textContent = "";
    }

    micBtn.addEventListener("click", () => {
      if (isRecording) stopListening();
      else startListening();
    });

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

    // --- Integration management ---
    function renderIntegrationsList() {
      integrationsListEl.innerHTML = "";
      if (!integrations.length) return;
      for (let i = 0; i < integrations.length; i++) {
        const item = integrations[i];
        let desc = "";
        if (item.type === "plugin") {
          desc = `🔌 Plugin: ${item.id} — tools: ${(item.allowed_tools || []).join(", ")}`;
        } else if (item.type === "mcp_server") {
          desc = `⚙️ MCP Server: ${item.name}${item.url ? " @ " + item.url : ""}`;
        }
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<span>${desc}</span><button class="remove-btn" data-index="${i}" title="Remove">✕</button>`;
        integrationsListEl.appendChild(div);
      }
    }

    function addIntegration() {
      const type = integrationTypeSel.value;
      if (!type) return;

      let entry = { type };

      if (type === "plugin") {
        const id = document.getElementById("plugin-id").value.trim();
        const toolsRaw = document.getElementById("plugin-tools").value.trim();
        if (!id) { status.textContent = "Please enter a Plugin ID."; return; }
        entry.id = id;
        entry.allowed_tools = toolsRaw ? toolsRaw.split(/[,\s]+/).filter(Boolean) : [];
      } else if (type === "mcp_server") {
        const name = document.getElementById("mcp-server-name").value.trim();
        const url = document.getElementById("mcp-server-url").value.trim();
        if (!name) { status.textContent = "Please enter a Server name."; return; }
        entry.name = name;
        if (url) entry.url = url;
      }

      integrations.push(entry);
      renderIntegrationsList();
      integrationTypeSel.value = "";
      configPlugin.classList.remove("open");
      configMcpServer.classList.remove("open");
      status.textContent = `Added ${type}: ${entry.name || entry.id}`;
    }

    function removeIntegration(index) {
      integrations.splice(index, 1);
      renderIntegrationsList();
    }

    // Delegate clicks on the list for remove buttons
    integrationsListEl.addEventListener("click", e => {
      if (e.target.classList.contains("remove-btn")) {
        removeIntegration(parseInt(e.target.dataset.index, 10));
      }
    });

    addIntegrationBtn.addEventListener("click", addIntegration);
  </script>
</body>
</html>
