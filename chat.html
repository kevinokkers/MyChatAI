<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LM Studio Chat + MCP</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 750px; margin: 2rem auto; padding: 0 1rem; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
    select, input, button { font-size: 0.95rem; padding: 0.45rem 0.6rem; }
    select { flex: 1; min-width: 200px; }
    button { cursor: pointer; background: #333; color: #fff; border: none; border-radius: 4px; }
    button:hover { background: #555; }
    #mcp-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; margin-bottom: 0.5rem; }
    #mcp-panel { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.75rem; display: none; }
    #mcp-panel.open { display: block; }
    #mcp-panel label { font-size: 0.85rem; display: block; margin-bottom: 0.25rem; }
    #mcp-json { width: 100%; font-family: monospace; font-size: 0.85rem; min-height: 80px; resize: vertical; }
    #log { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-height: 200px; margin-bottom: 0.75rem; white-space: pre-wrap; }
    .msg { margin-bottom: 0.6rem; }
    .msg.user { color: #0057b7; }
    .msg.assistant { color: #1a1a1a; }
    .msg.tool { color: #7a5c00; font-size: 0.85rem; background: #fffbe6; padding: 0.4rem; border-radius: 4px; }
    .msg.stats { color: #888; font-size: 0.8rem; margin-top: 0.5rem; }
    .input-row { display: flex; gap: 0.5rem; }
    .input-row input { flex: 1; }
    #status { font-size: 0.85rem; color: #888; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <h1>LM Studio Chat <small style="font-size:0.6em;color:#888">+ MCP</small></h1>

  <div class="controls">
    <select id="model"><option>Loading models…</option></select>
    <button id="refresh">↻</button>
  </div>

  <label id="mcp-toggle">
    <input type="checkbox" id="mcp-enabled" /> Enable MCP integrations
  </label>
  <div id="mcp-panel">
    <label>Integrations (JSON array):</label>
    <textarea id="mcp-json" spellcheck="false">[
  { "type": "plugin", "id": "mcp/playwright", "allowed_tools": ["browser_navigate"] }
]</textarea>
  </div>

  <div id="log"></div>
  <div class="input-row">
    <input id="input" placeholder="Type a message…" autocomplete="off" />
    <button id="send">Send</button>
  </div>
  <div id="status"></div>

  <script>
    const BASE = "http://localhost:1234";
    const modelSel = document.getElementById("model");
    const mcpEnabled = document.getElementById("mcp-enabled");
    const mcpPanel = document.getElementById("mcp-panel");
    const mcpJson = document.getElementById("mcp-json");
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const status = document.getElementById("status");

    // --- Model list ---
    async function loadModels() {
      modelSel.innerHTML = '<option>Loading…</option>';
      try {
        const res = await fetch(`${BASE}/api/v1/models`);
        const data = await res.json();
        const llms = data.models.filter(m => m.type === "llm");
        modelSel.innerHTML = "";
        if (!llms.length) {
          modelSel.innerHTML = '<option>No LLM models found</option>';
          return;
        }
        for (const m of llms) {
          const opt = document.createElement("option");
          opt.value = m.key;
          opt.textContent = m.display_name || m.key;
          modelSel.appendChild(opt);
        }
      } catch (e) {
        modelSel.innerHTML = '<option>Failed to load models</option>';
        status.textContent = `Model list error: ${e.message}`;
      }
    }

    document.getElementById("refresh").addEventListener("click", loadModels);
    loadModels();

    // --- MCP toggle ---
    mcpEnabled.addEventListener("change", () => {
      mcpPanel.classList.toggle("open", mcpEnabled.checked);
    });

    // --- Chat ---
    function addMsg(cls, text) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMsg("user", `You: ${text}`);
      status.textContent = "Waiting…";

      const body = {
        model: modelSel.value,
        input: text,
        context_length: 8000
      };

      if (mcpEnabled.checked) {
        try {
          body.integrations = JSON.parse(mcpJson.value);
        } catch {
          status.textContent = "MCP JSON parse error – check your integrations array.";
          return;
        }
      }

      try {
        const res = await fetch(`${BASE}/api/v1/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        // Render output items (messages + tool calls)
        for (const item of data.output) {
          if (item.type === "tool_call") {
            const args = JSON.stringify(item.arguments, null, 2);
            addMsg("tool", `🔧 Tool: ${item.tool}\n   Args: ${args}\n   Result: ${String(item.output).slice(0, 300)}`);
          } else if (item.type === "message") {
            addMsg("assistant", `Assistant: ${item.content}`);
          }
        }

        // Stats
        if (data.stats) {
          const s = data.stats;
          addMsg("stats",
            `⏱ ${s.time_to_first_token_seconds?.toFixed(2)}s TTFT · ` +
            `${s.tokens_per_second?.toFixed(1)} tok/s · ` +
            `${s.input_tokens} in / ${s.total_output_tokens} out`
          );
        }

        status.textContent = "";
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    }

    document.getElementById("send").addEventListener("click", send);
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
